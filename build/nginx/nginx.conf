worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    # .zip/.tgz 是二进制产物且本身已压缩，不要加入 gzip_types

    # ---- 静态资源缓存 ----
    # 前端 JS/CSS 带内容 hash，重复请求直接由 nginx 命中，不打到 Go（仅 9090 控制台使用）
    proxy_cache_path /tmp/nginx-static levels=1:2 keys_zone=static_cache:16m
                     max_size=256m inactive=7d use_temp_path=off;

    # npm 客户端 publish 类请求不存在（只读镜像），请求体极小
    client_max_body_size 1M;

    keepalive_timeout 65s;

    # ---- 上游（Go 后端）连接与超时 ----
    # 首次拉取大 zip/tarball 时 Go 侧预算 30 分钟，nginx 必须留够余量，否则先返回 504
    proxy_connect_timeout 30s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    # 关闭响应缓冲：大产物直接流式转发，不先落 nginx 临时文件
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 五 server 块（职责互斥）：9090 控制台 / 9091 npm / 9092 GOPROXY / 9093 PyPI Simple /
    # 9094 Maven 仓库，各自转发到容器内后端对应端口（8090/8091/8092/8093/8094）。

    # ---- 9090 控制台：SPA + /api 聚合 + /admin + 聚合 healthz/metrics ----
    server {
        listen 9090;
        server_name _;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # 带内容 hash 的构建产物：nginx 层缓存（注意此处需单独开缓冲）
        location /static/ {
            proxy_pass http://127.0.0.1:8090;
            proxy_buffering on;
            proxy_max_temp_file_size 64m;
            proxy_cache static_cache;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 304 7d;
            proxy_cache_lock on;
        }

        location / {
            proxy_pass http://127.0.0.1:8090;
        }
    }

    # ---- 9091 npm Registry：packument / tarball / audit 透传 ----
    server {
        listen 9091;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            proxy_pass http://127.0.0.1:8091;
        }
    }

    # ---- 9092 GOPROXY：@v/* / @latest / info / mod / zip / ziphash / sumdb ----
    server {
        listen 9092;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            proxy_pass http://127.0.0.1:8092;
        }
    }

    # ---- 9093 PyPI Simple：/simple/* 锚点页 / /packages/* 发行文件 ----
    server {
        listen 9093;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            proxy_pass http://127.0.0.1:8093;
        }
    }

    # ---- 9094 Maven 仓库：maven-metadata.xml / 构件文件 / 校验和 ----
    server {
        listen 9094;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            proxy_pass http://127.0.0.1:8094;
        }
    }
}
